[project]
name = "halite-voice-runtime"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
# Reviewed inference dependencies. Upstream demo/web dependencies are omitted.
dependencies = [
  "torch==2.6.0; (sys_platform == 'darwin' or platform_machine != 'x86_64') and python_version == '3.11'",
  "torch==2.6.0+cpu; sys_platform != 'darwin' and platform_machine == 'x86_64' and python_version == '3.11'",
  "torchaudio==2.6.0; (sys_platform == 'darwin' or platform_machine != 'x86_64') and python_version == '3.11'",
  "torchaudio==2.6.0+cpu; sys_platform != 'darwin' and platform_machine == 'x86_64' and python_version == '3.11'",
  "numpy==1.26.4; python_version == '3.11'",
  "librosa==0.11.0; python_version == '3.11'",
  "transformers==5.10.1; python_version == '3.11'",
  "diffusers==0.29.0; python_version == '3.11'",
  "resemble-perth==1.0.1; python_version == '3.11'",
  "conformer==0.3.2; python_version == '3.11'",
  "safetensors==0.5.3; python_version == '3.11'",
  "s3tokenizer==0.3.0; python_version == '3.11'",
  "spacy-pkuseg==1.0.1; python_version == '3.11'",
  "pykakasi==2.3.0; python_version == '3.11'",
  "pyloudnorm==0.1.1; python_version == '3.11'",
  "omegaconf==2.3.0; python_version == '3.11'",
  "ml-dtypes==0.5.4; python_version == '3.11'",
  "setuptools==80.9.0; python_version == '3.11'",
]
