[package]
name = "halite"
version = "0.1.0"
description = "Free & open-source AI music toolkit: stem separation, downloads and lyrics."
authors = ["taliyigit2-prog"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "halite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
lofty = "0.25"
tempfile = "3"
fs2 = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

# Audio decoding
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "isomp4", "ogg", "wav", "pcm"] }

# WAV encoding
hound = "3"

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# Networking (model download, yt-dlp download, LRCLIB)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time", "io-util"] }

# ffmpeg management (transcoding + yt-dlp audio extraction)
ffmpeg-sidecar = "2"

# Paths
dirs = "5"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# AI inference (ONNX Runtime + CoreML). CoreML is macOS-only, so the feature
# is enabled per-target to keep Windows/Linux builds working.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = [] }

[profile.release]
opt-level = "s"
strip = true
